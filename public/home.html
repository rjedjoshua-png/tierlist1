<!DOCTYPE html>
<html lang="en" data-page="home">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TierHub</title>
<link rel="icon" type="image/png" sizes="512x512" href="/logo.png">
<script src="https://js.pusher.com/8.0/pusher.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #08090f; color: #f7f8fc; min-height: 100vh; }
  #design-root { min-height: 100vh; }
  .design-loading {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; color: #9ca3c7; font-family: sans-serif; font-size: 14px;
  }
</style>
</head>
<body>
<div id="design-root">
  <div class="design-loading">Loading…</div>
</div>

<script>
(function () {
  const API = window.location.origin;

  function detectSlug() {
    const path = location.pathname.replace(/^\/+|\/+$/g, '');
    const known = ['home', 'rankings', 'testers', 'compare', 'profile', ''];
    if (known.includes(path)) {
      return new URLSearchParams(location.search).get('slug') || null;
    }
    const parts = path.split('/');
    return parts[0] || null;
  }

  const SLUG = detectSlug();
  const PAGE = 'home';

  async function loadDesign() {
    let design = 'default';
    let siteConfig = {
      name: 'TierHub',
      avatar_url: null,
      discord_invite: null,
      slug: SLUG,
      design: 'default'
    };

    try {
      const params = SLUG ? '?slug=' + encodeURIComponent(SLUG) : '';
      const r = await fetch(API + '/api/site-config' + params);
      if (r.ok) {
        const cfg = await r.json();
        siteConfig = { ...siteConfig, ...cfg };
        if (cfg.design && /^[a-z0-9][a-z0-9-]{0,30}$/.test(String(cfg.design).toLowerCase())) {
          design = String(cfg.design).toLowerCase();
        }
      }
    } catch (e) {
      console.warn('[shell] site-config failed, using default design', e);
    }

    const designPath = '/designs/' + design + '/' + PAGE + '.html';
    let html = '';

    try {
      const r = await fetch(designPath);
      if (!r.ok) throw new Error('status ' + r.status);
      html = await r.text();
    } catch (e) {
      console.warn('[shell] design fetch failed, falling back to default', e);
      if (design !== 'default') {
        try {
          const r = await fetch('/designs/default/' + PAGE + '.html');
          if (r.ok) html = await r.text();
        } catch (_) { /* ignore */ }
      }
      if (!html) {
        document.getElementById('design-root').innerHTML =
          '<div class="design-loading">Failed to load page.</div>';
        return;
      }
    }

    // Extract <style> and <script> blocks and the body
    const doc = new DOMParser().parseFromString(html, 'text/html');

    // Inject any <link rel="stylesheet">
    doc.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
      const href = link.getAttribute('href');
      if (!href) return;
      if (document.querySelector('link[data-design-css][href="' + href + '"]')) return;
      const clone = link.cloneNode();
      clone.setAttribute('data-design-css', '1');
      document.head.appendChild(clone);
    });

    // Inject any <style>
    doc.querySelectorAll('style').forEach(st => {
      const s = document.createElement('style');
      s.setAttribute('data-design-css', '1');
      s.textContent = st.textContent;
      document.head.appendChild(s);
    });

    // Replace body content
    const root = document.getElementById('design-root');
    root.innerHTML = doc.body.innerHTML;

    // Re-inject <script> tags so they actually execute
    doc.querySelectorAll('script').forEach(oldScript => {
      const s = document.createElement('script');
      Array.from(oldScript.attributes).forEach(a => s.setAttribute(a.name, a.value));
      s.textContent = oldScript.textContent;
      document.body.appendChild(s);
    });

    // Expose globals the design's inline scripts can use
    window.__SITE_CONFIG__ = siteConfig;
    window.__SLUG__ = SLUG;
    window.__PAGE__ = PAGE;
    window.__API__ = API;

    document.dispatchEvent(new CustomEvent('design-ready', {
      detail: { design, config: siteConfig }
    }));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadDesign);
  } else {
    loadDesign();
  }
})();
</script>
</body>
</html>
